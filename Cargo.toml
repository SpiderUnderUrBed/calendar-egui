[package]
name = "calendar-egui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
eframe = "0.34.2"
egui = "0.34.2"
egui_extras = "0.34.2"
env_logger = "0.11.10"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.3", features = ["json"] }
